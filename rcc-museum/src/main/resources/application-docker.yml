server:
  port: 8088

spring:
  application:
    name: rcc-museum
  datasource:
    url: jdbc:mysql://rcc-mysql:3306/rcc_museum?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: secret
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: rcc_museum
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: 'http://rcc-auth:9000/oauth2/jwks'

grpc:
  server:
    port: 9093
    max-inbound-message-size: 20971520
    security:
      enabled: false

  client:
    country:
      address: 'static://rcc-geo:9094'
      negotiation-type: plaintext