server:
  port: 8086

spring:
  application:
    name: rcc-artist
  datasource:
    url: jdbc:mysql://rcc-mysql:3306/rcc_artist?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: secret
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: rcc_artist
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: 'http://rcc-auth:9000/oauth2/jwks'

grpc:
  server:
    port: 9090
    max-inbound-message-size: 20971520
    security:
      enabled: false