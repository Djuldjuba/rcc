spring:
  application:
    name: rcc-artist

  datasource:
    url: jdbc:mysql://localhost:3306/rcc_artist?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: secret
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    defer-datasource-initialization: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    generate-ddl: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: rcc_artist
    locations: classpath:db/migration
    table: flyway_schema_history

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: 'http://localhost:9000/oauth2/jwks'

grpc:
  server:
    port: 9090
    max-inbound-message-size: 20971520
    security:
      enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.internal.util.EntityPrinter: WARN

server:
  port: 8086