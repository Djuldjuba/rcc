syntax = "proto3";

package io.student.rcc.painting;

option java_multiple_files = true;
option java_package = "io.student.rcc.painting.grpc";
option java_outer_classname = "PaintingProto";

service PaintingService {
  rpc GetPainting(GetPaintingRequest) returns (PaintingResponseProto);
  rpc GetAllPaintings(EmptyRequest) returns (PaintingListResponseProto);
  rpc AddPainting(CreatePaintingRequestProto) returns (PaintingResponseProto);
  rpc UpdatePainting(UpdatePaintingRequestProto) returns (PaintingResponseProto);
  rpc DeletePainting(DeletePaintingRequest) returns (EmptyResponse);
  rpc SearchPaintings(SearchRequest) returns (PaintingListResponseProto);
  rpc GetPaintingsByArtist(GetPaintingsByArtistRequest) returns (PaintingListResponseProto);
  rpc GetPaintingsByMuseum(GetPaintingsByMuseumRequest) returns (PaintingListResponseProto);
}

message EmptyRequest {}
message EmptyResponse {}

message GetPaintingRequest {
  string id = 1;
}

message DeletePaintingRequest {
  string id = 1;
}

message GetPaintingsByArtistRequest {
  string artistId = 1;
  int32 page = 2;
  int32 size = 3;
}

message GetPaintingsByMuseumRequest {
  string museumId = 1;
  int32 page = 2;
  int32 size = 3;
}

message CreatePaintingRequestProto {
  string title = 1;
  string description = 2;
  string content = 3;
  string artistId = 4;
  string museumId = 5;
}

message UpdatePaintingRequestProto {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string content = 4;
  optional string artistId = 5;
  optional string museumId = 6;
}

message SearchRequest {
  string title = 1;
  int32 page = 2;
  int32 size = 3;
}

message PaintingResponseProto {
  string id = 1;
  string title = 2;
  string description = 3;
  string content = 4;
  string artistId = 5;
  string artistName = 6;
  string museumId = 7;
  string museumTitle = 8;
}

message PaintingListResponseProto {
  repeated PaintingResponseProto paintings = 1;
  int32 totalPages = 2;
  int64 totalElements = 3;
}