server:
  port: 8085

spring:
  application:
    name: rcc-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: 'http://localhost:9000/oauth2/jwks'

grpc:
  client:
    artist-service:
      address: 'static://localhost:9090'
      negotiation-type: plaintext
      max-inbound-message-size: 20971520
    museum-service:
      address: 'static://localhost:9093'
      negotiation-type: plaintext
      max-inbound-message-size: 20971520
    painting-service:
      address: 'static://localhost:9091'
      negotiation-type: plaintext
      max-inbound-message-size: 20971520
    geo-service:
      address: 'static://localhost:9094'
      negotiation-type: plaintext
    userdata-service:
      address: 'static://localhost:9095'
      negotiation-type: plaintext

rococo-front:
  base-uri: 'http://localhost:3000'
rococo-gateway:
  base-uri: 'http://localhost:8085'

logging:
  level:
    root: INFO
    io.student.rcc: DEBUG
    org.springframework.security: DEBUG