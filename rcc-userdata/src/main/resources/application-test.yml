# src/test/resources/application-test.yml
spring:
  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:rcc-userdata;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  jpa:
    generate-ddl: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: 'http://localhost:9000'

grpc:
  server:
    port: 0
    security:
      enabled: false

logging:
  level:
    root: WARN