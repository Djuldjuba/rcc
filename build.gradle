plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '4.0.2' apply false
    id 'com.google.protobuf' version '0.9.4' apply false
    id 'com.google.cloud.tools.jib' version '3.5.1' apply false
    id 'io.qameta.allure' version '3.0.1' apply false
}

wrapper {
    gradleVersion = '9.2.1'
}

allprojects {
    group = 'io.student'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    ext {
        lombokVersion          = '1.18.36'
        mysqlDriverVersion     = '8.0.33'
        flywayVersion          = '11.14.1'
        flywayMysqlVersion     = '11.14.1'
        grpcVersion            = '1.68.1'
        protobufVersion        = '3.25.5'
        grpcSpringBootVersion  = '3.1.0.RELEASE'
        javaxAnnotationVersion = '1.3.2'
        jibBaseImage           = 'eclipse-temurin:21-jre'
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.2"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}