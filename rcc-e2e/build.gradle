plugins {
    id 'io.qameta.allure'
    id 'com.google.protobuf'
}

ext {
    junitVersion             = '5.14.1'
    allureVersion            = '2.32.0'
    aspectJVersion           = '1.9.22'
    selenideVersion          = '7.13.0'
    okhttp3Version           = '5.3.2'
    retrofitVersion          = '3.0.0'
    logbackVersion           = '1.5.22'
    slf4jVersion             = '2.0.17'
    springJdbcVersion        = '6.2.12'
    springCryptoVersion      = '6.5.6'
    p6spyVersion             = '3.9.1'
    hibernateVersion         = '6.3.1.Final'
    kafkaClientsVersion      = '4.1.1'
    springDataCommonsVersion = '3.5.5'
    wiremockVersion          = '3.13.2'
    fakerVersion             = '2.4.3'
    postgresDriverVersion    = '42.7.3'
    mysqlDriverVersion       = '8.0.33'
    lombokVersion            = '1.18.36'
    grpcVersion              = '1.68.1'
    protobufVersion          = '4.28.2'
    jakartaJaxbVersion       = '4.0.5'
    saajVersion              = '3.0.4'
    atomikosVersion          = '6.0.0'
    jakartaPersistenceVersion = '3.1.0'
    jakartaTransactionVersion = '2.0.1'
    hikariVersion            = '5.0.1'
    ashotVersion             = '1.5.4'
}

repositories {
    mavenCentral()
}

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = true
    }
}

dependencies {
    testImplementation "ch.qos.logback:logback-classic:${logbackVersion}"
    testImplementation "org.slf4j:slf4j-api:${slf4jVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"

    testImplementation "com.squareup.okhttp3:logging-interceptor:${okhttp3Version}"
    testImplementation "com.squareup.okhttp3:okhttp-urlconnection:${okhttp3Version}"
    testImplementation "com.squareup.okhttp3:okhttp:${okhttp3Version}"
    testImplementation("com.squareup.retrofit2:retrofit:${retrofitVersion}") {
        exclude group: "com.squareup.okhttp3"
    }
    testImplementation("com.squareup.retrofit2:converter-jackson:${retrofitVersion}") {
        exclude group: "com.squareup.okhttp3"
    }
    testImplementation "org.springframework.data:spring-data-commons:${springDataCommonsVersion}"

    testImplementation "org.springframework:spring-jdbc:${springJdbcVersion}"
    testImplementation "org.postgresql:postgresql:${postgresDriverVersion}"
    testImplementation "mysql:mysql-connector-java:${mysqlDriverVersion}"
    testImplementation "p6spy:p6spy:${p6spyVersion}"
    testImplementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"
    testImplementation "org.springframework.security:spring-security-crypto:${springCryptoVersion}"
    testImplementation 'com.github.h-thurow:simple-jndi:0.25.0'

    testImplementation "jakarta.persistence:jakarta.persistence-api:${jakartaPersistenceVersion}"
    testImplementation "jakarta.transaction:jakarta.transaction-api:${jakartaTransactionVersion}"
    testImplementation "com.atomikos:atomikos-util:${atomikosVersion}"
    testImplementation "com.atomikos:transactions-jdbc:${atomikosVersion}:jakarta"
    testImplementation "com.atomikos:transactions-jta:${atomikosVersion}:jakarta"
    testImplementation("com.atomikos:transactions-hibernate4:${atomikosVersion}:jakarta") {
        exclude group: 'org.hibernate'
    }
    testImplementation "com.zaxxer:HikariCP:${hikariVersion}"

    agent "org.aspectj:aspectjweaver:${aspectJVersion}"
    testImplementation platform("io.qameta.allure:allure-bom:$allureVersion")
    testImplementation "io.qameta.allure:allure-attachments"
    testImplementation "io.qameta.allure:allure-okhttp3"
    testImplementation("io.qameta.allure:allure-junit5") {
        exclude group: "org.junit.jupiter"
    }
    testImplementation("io.qameta.allure:allure-selenide") {
        exclude group: 'com.codeborne'
    }

    testImplementation "com.codeborne:selenide:${selenideVersion}"
    testImplementation "ru.yandex.qatools.ashot:ashot:${ashotVersion}"

    testImplementation("net.datafaker:datafaker:${fakerVersion}") {
        exclude group: 'org.yaml'
    }
    testImplementation 'commons-io:commons-io:2.21.0'
    testImplementation 'com.google.code.findbugs:jsr305:3.0.2'
    testImplementation 'com.github.vertical-blank:sql-formatter:2.0.5'

    testImplementation "io.grpc:grpc-api:${grpcVersion}"
    testImplementation "io.grpc:grpc-stub:${grpcVersion}"
    testImplementation "io.grpc:grpc-protobuf:${grpcVersion}"
    testImplementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    testImplementation "com.google.protobuf:protobuf-java:${protobufVersion}"
    testImplementation "com.google.protobuf:protobuf-java-util:${protobufVersion}"
    testImplementation "javax.annotation:javax.annotation-api:1.3.2"

    testImplementation "com.sun.xml.messaging.saaj:saaj-impl:${saajVersion}"
    testImplementation "jakarta.xml.bind:jakarta.xml.bind-api:${jakartaJaxbVersion}"

    testImplementation "org.apache.kafka:kafka-clients:${kafkaClientsVersion}"
    testImplementation "org.wiremock:wiremock:${wiremockVersion}"

    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    compileOnly 'jakarta.annotation:jakarta.annotation-api:1.3.5'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    test {
        proto {
            srcDir 'src/test/proto'
        }
        java {
            srcDirs "${buildDir}/generated/source/proto/test/java"
            srcDirs "${buildDir}/generated/source/proto/test/grpc"
        }
    }
}

processTestResources {
    exclude '**/*.proto'
}

allure {
    version = allureVersion
}

test {
    useJUnitPlatform()
    jvmArgs = ["-javaagent:${configurations.agent.singleFile}"]

    systemProperty 'test.env', System.getProperty('test.env', System.getenv('TEST_ENV') ?: 'local')
    systemProperty 'user.timezone', System.getProperty('user.timezone', 'UTC')
    systemProperty 'browser', System.getProperty('browser', System.getenv('BROWSER') ?: 'chrome')

    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}