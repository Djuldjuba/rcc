name: e2e

on:
  pull_request:
    types: [ opened, reopened, synchronize ]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: test
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EXECUTION_TYPE: github
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Unit Tests
        id: unit-tests
        run: |
          chmod +x gradlew
          ./gradlew test -x :rcc-e2e:test -Duser.timezone=UTC

      - name: Report test results
        uses: dorny/test-reporter@v2
        if: always() && steps.unit-tests.outcome != 'skipped'
        continue-on-error: true
        with:
          name: Unit & Integration tests
          path: '**/build/test-results/test/TEST-*.xml'
          reporter: java-junit
          badge-title: 'unit & integration tests'
          fail-on-error: false
          fail-on-empty: false

      - name: Add comment to PR with unit tests status
        if: always() && steps.unit-tests.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = '${{ steps.unit-tests.outcome }}'
            const message = buildStatus === 'success'
              ? `✅ UNIT & INTEGRATION TESTS PASSED`
              : `🔴 UNIT & INTEGRATION TESTS FAILED`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })

      - name: Build backends
        id: build
        run: |
          chmod +x gradlew
          ./gradlew clean jibBuildTar -x test -x :rcc-e2e:test -Duser.timezone=UTC
          for module in rcc-auth rcc-gateway rcc-artist rcc-painting rcc-museum rcc-geo rcc-userdata rcc-log-kafka-service; do
            TAR_PATH="$module/build/jib-image.tar"
            if [ -f "$TAR_PATH" ]; then
              echo "Loading $TAR_PATH ..."
              docker load -i "$TAR_PATH"
            else
              echo "WARNING: $TAR_PATH not found!"
            fi
          done

      - name: Build frontend
        run: |
          docker build -t rcc-client:latest ./rcc-client

      - name: Build e2e image
        run: |
          docker build -t rcc-e2e:latest -f ./rcc-e2e/Dockerfile .

      - name: Pull Docker images
        run: |
          docker pull mysql:8.4.7
          docker pull apache/kafka:3.9.0
          docker pull provectuslabs/kafka-ui:latest
          docker pull aerokube/selenoid:latest-release
          docker pull aerokube/selenoid-ui:latest-release
          docker pull frankescobar/allure-docker-service
          docker pull frankescobar/allure-docker-service-ui
          docker pull twilio/selenoid:chrome_stable_135

      - name: Get the last commit message
        run: |
          echo "HEAD_COMMIT_MESSAGE=$(git log -1 --format=%s ${{ github.event.pull_request.head.sha }})" >> $GITHUB_ENV

      - name: Prepare screenshot dir
        run: |
          mkdir -p rcc-e2e/.screen-output/screenshots/selenoid

      - name: Run e2e-tests
        id: e2e
        timeout-minutes: 30
        run: |
          docker compose --profile test up -d --wait
          docker ps -a

          echo "### Waiting for e2e tests to finish ###"
          docker wait rcc-e2e || true

          exit_code=$(docker inspect -f '{{.State.ExitCode}}' rcc-e2e)
          echo "E2E_EXIT_CODE=$exit_code" >> $GITHUB_OUTPUT

          echo "### Test logs ###"
          docker logs rcc-e2e 2>&1 | grep -v "Hibernate:" | grep -v "p6spy" | grep -v ">>> JDBC URL" | grep -v "Extracted JDBC value" | tail -n 400

          if [ "$exit_code" -eq "0" ]; then
            echo "Tests passed successfully!"
          else
            echo "Tests failed with exit code $exit_code"
          fi

          exit $exit_code

      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        continue-on-error: true
        with:
          gh_pages: gh-pages
          allure_results: rcc-e2e/build/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to Github Pages
        if: always()
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          force_orphan: true

      - name: Add comment to PR with Allure report
        if: always() && steps.e2e.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const runNumber = context.runNumber
            const reportUrl = `https://${owner}.github.io/${repo}/${runNumber}/index.html`
            const exitCode = '${{ steps.e2e.outputs.E2E_EXIT_CODE }}'
            const status = exitCode == '0' ? '✅ PASSED' : '🔴 FAILED'
            const message = `📊 Allure report: [open report](${reportUrl})\nE2E tests status: ${status}`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ github.run_id }}
          path: |
            rcc-e2e/.screen-output/screenshots/selenoid/**/*.png
          if-no-files-found: warn
          retention-days: 14