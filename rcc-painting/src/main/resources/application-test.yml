spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:rcc-painting;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  jpa:
    generate-ddl: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    open-in-view: false
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks

grpc:
  server:
    port: 0
    max-inbound-message-size: 20971520
    security:
      enabled: false

  client:
    artist:
      address: 'static://localhost:19090'
      negotiation-type: plaintext
    museum:
      address: 'static://localhost:19093'
      negotiation-type: plaintext

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN