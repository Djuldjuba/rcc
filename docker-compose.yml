services:
  rcc-mysql:
    image: mysql:8.4.7
    container_name: rcc-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - rcc-volume:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - rcc-net

  rcc-kafka:
    image: apache/kafka:3.9.0
    container_name: rcc-kafka
    hostname: rcc-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # без 0.0.0.0
      KAFKA_LISTENERS: PLAINTEXT://rcc-kafka:9092,CONTROLLER://rcc-kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://rcc-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@rcc-kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "10"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server rcc-kafka:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
    networks:
      - rcc-net

  rcc-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rcc-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: rcc-kafka:9092
    depends_on:
      rcc-kafka:
        condition: service_healthy
    networks:
      - rcc-net

  rcc-auth:
    image: rcc-auth:latest
    container_name: rcc-auth
    depends_on:
      rcc-mysql:
        condition: service_healthy
      rcc-kafka:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:InitialHeapSize=256m -XX:MaxHeapSize=512m"
    restart: always
    networks:
      - rcc-net

  rcc-artist:
    image: rcc-artist:latest
    container_name: rcc-artist
    depends_on:
      rcc-mysql:
        condition: service_healthy
      rcc-auth:
        condition: service_started
    ports:
      - "8086:8086"
      - "9090:9090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:InitialHeapSize=256m -XX:MaxHeapSize=512m"
    restart: always
    networks:
      - rcc-net

  rcc-painting:
    image: rcc-painting:latest
    container_name: rcc-painting
    depends_on:
      rcc-mysql:
        condition: service_healthy
      rcc-auth:
        condition: service_started
    ports:
      - "8087:8087"
      - "9091:9091"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:InitialHeapSize=256m -XX:MaxHeapSize=512m"
    restart: always
    networks:
      - rcc-net

  rcc-museum:
    image: rcc-museum:latest
    container_name: rcc-museum
    depends_on:
      rcc-mysql:
        condition: service_healthy
      rcc-auth:
        condition: service_started
    ports:
      - "8088:8088"
      - "9093:9093"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:InitialHeapSize=256m -XX:MaxHeapSize=512m"
    restart: always
    networks:
      - rcc-net

  rcc-geo:
    image: rcc-geo:latest
    container_name: rcc-geo
    depends_on:
      rcc-mysql:
        condition: service_healthy
      rcc-auth:
        condition: service_started
    ports:
      - "8091:8091"
      - "19092:9092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:InitialHeapSize=256m -XX:MaxHeapSize=512m"
    restart: always
    networks:
      - rcc-net

  rcc-userdata:
    image: rcc-userdata:latest
    container_name: rcc-userdata
    depends_on:
      rcc-mysql:
        condition: service_healthy
      rcc-auth:
        condition: service_started
      rcc-kafka:
        condition: service_healthy
    ports:
      - "8090:8090"
      - "9095:9095"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:InitialHeapSize=256m -XX:MaxHeapSize=512m"
    restart: always
    networks:
      - rcc-net

  rcc-log-kafka-service:
    image: rcc-log-kafka-service:latest
    container_name: rcc-log-kafka-service
    depends_on:
      rcc-mysql:
        condition: service_healthy
      rcc-kafka:
        condition: service_healthy
    ports:
      - "8092:8092"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:InitialHeapSize=256m -XX:MaxHeapSize=512m"
    restart: always
    networks:
      - rcc-net

  rcc-gateway:
    image: rcc-gateway:latest
    container_name: rcc-gateway
    depends_on:
      - rcc-auth
      - rcc-artist
      - rcc-painting
      - rcc-museum
      - rcc-geo
      - rcc-userdata
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: "-XX:InitialHeapSize=256m -XX:MaxHeapSize=512m"
    restart: always
    networks:
      - rcc-net

  rcc-client:
    image: rcc-client:latest
    container_name: rcc-client
    depends_on:
      - rcc-gateway
    ports:
      - "3000:80"
    restart: always
    networks:
      - rcc-net

  selenoid:
    image: aerokube/selenoid:latest-release
    container_name: selenoid
    volumes:
      - ./selenoid:/etc/selenoid
      - /var/run/docker.sock:/var/run/docker.sock
      - selenoid-video:/opt/selenoid/video
      - selenoid-logs:/opt/selenoid/logs
    environment:
      - TZ=Europe/Moscow
      - DOCKER_API_VERSION=1.45
    restart: unless-stopped
    command: [
      "-conf", "/etc/selenoid/browsers.json",
      "-limit", "3",
      "-video-output-dir", "/opt/selenoid/video",
      "-log-output-dir", "/opt/selenoid/logs",
      "-container-network", "rcc-net"
    ]
    ports:
      - "4444:4444"
    networks:
      - rcc-net

  selenoid-ui:
    image: aerokube/selenoid-ui:latest-release
    container_name: selenoid-ui
    depends_on:
      - selenoid
    ports:
      - "9099:8080"
    command: ["--selenoid-uri", "http://selenoid:4444"]
    networks:
      - rcc-net

  allure:
    image: frankescobar/allure-docker-service
    container_name: allure
    environment:
      - CHECK_RESULTS_EVERY_SECONDS=NONE
      - KEEP_HISTORY=1
      - KEEP_HISTORY_LATEST=25
    ports:
      - "5050:5050"
    networks:
      - rcc-net

  allure-ui:
    image: frankescobar/allure-docker-service-ui
    container_name: allure-ui
    environment:
      - ALLURE_DOCKER_PUBLIC_API_URL=http://localhost:5050
      - ALLURE_DOCKER_PUBLIC_API_URL_PREFIX=
    ports:
      - "5252:5252"
    depends_on:
      - allure
    networks:
      - rcc-net

  rcc-e2e:
    image: rcc-e2e:latest
    container_name: rcc-e2e
    environment:
      - ALLURE_DOCKER_API=http://allure:5050/
      - BUILD_URL=${BUILD_URL:-local}
      - HEAD_COMMIT_MESSAGE=${HEAD_COMMIT_MESSAGE:-local build}
      - EXECUTION_TYPE=${EXECUTION_TYPE:-local}
      - BROWSER=${BROWSER:-chrome}
      - TZ=Europe/Moscow
      - TEST_ENV=docker
    depends_on:
      rcc-kafka:
        condition: service_healthy
      rcc-mysql:
        condition: service_healthy
      rcc-auth:
        condition: service_started
      rcc-userdata:
        condition: service_started
      rcc-client:
        condition: service_started
      rcc-gateway:
        condition: service_started
      selenoid:
        condition: service_started
      allure:
        condition: service_started
    networks:
      - rcc-net
    profiles:
      - test

volumes:
  rcc-volume:
  selenoid-video:
  selenoid-logs:

networks:
  rcc-net:
    name: rcc-net
    driver: bridge