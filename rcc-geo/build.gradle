plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.google.protobuf'
    id 'com.google.cloud.tools.jib'
}

group = 'io.student.rcc'
version = '1.0.0'

java {
    sourceCompatibility = '21'
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    runtimeOnly "mysql:mysql-connector-java:${mysqlDriverVersion}"
    runtimeOnly "org.flywaydb:flyway-mysql"

    // gRPC
    implementation 'net.devh:grpc-server-spring-boot-starter:3.1.0.RELEASE'
    implementation 'com.google.protobuf:protobuf-java-util:4.27.0'
    implementation 'io.grpc:grpc-netty-shaded:1.64.0'
    implementation 'io.grpc:grpc-services:1.64.0'
    implementation 'io.grpc:grpc-stub:1.64.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.27.0"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:1.64.0"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/main/proto'
        }
        java {
            srcDirs 'src/main/java'
            srcDirs "${buildDir}/generated/source/proto/main/java"
            srcDirs "${buildDir}/generated/source/proto/main/grpc"
        }
    }
}

processResources {
    exclude '**/*.proto'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jib {
    from {
        image = 'eclipse-temurin:21-jre'
    }
    to {
        image = 'rcc-geo:latest'
    }
    container {
        ports = ['8091', '9094']
        jvmFlags = ['-Xms256m', '-Xmx512m']
        creationTime = 'USE_CURRENT_TIMESTAMP'
        environment = [
                'SPRING_PROFILES_ACTIVE': 'docker'
        ]
    }
}

tasks.named('test') {
    useJUnitPlatform()
}